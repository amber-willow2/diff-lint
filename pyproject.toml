[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "difflint"
version = "0.1.0"
description = "A linter that reports problems in unified diffs by line number"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
difflint = "difflint.cli:main"

[tool.setuptools.packages.find]
include = ["difflint*"]
